<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelas 7E Spenda Music</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#050505,#111827,#0f172a);
  color: white;
  display: flex;
  min-height: 100vh;
  overflow-x: hidden;
}

.sidebar {
  width: 240px;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(10px);
  padding: 20px;
  position: fixed;
  height: 100%;
  border-right: 1px solid rgba(255,255,255,0.1);
}

.sidebar h1 {
  color: #00ffae;
  margin-bottom: 10px;
}

.sidebar p {
  opacity: 0.7;
  margin-bottom: 20px;
}

.sidebar button {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border: none;
  border-radius: 14px;
  background: rgba(255,255,255,0.08);
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

.sidebar button:hover {
  background: #00ffae;
  color: black;
  transform: scale(1.03);
}

.main {
  margin-left: 240px;
  flex: 1;
  padding: 20px;
}

.topbar {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.topbar input {
  flex: 1;
  padding: 12px;
  border-radius: 14px;
  border: none;
}

.song-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap: 20px;
}

.song-card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 12px;
  transition: 0.3s;
  box-shadow: 0 0 20px rgba(0,255,174,0.15);
}

.song-card:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow: 0 0 25px rgba(0,255,174,0.4);
}

.song-card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 14px;
}

.song-card h3 {
  margin-top: 10px;
}

.song-card p {
  opacity: 0.7;
  margin-top: 5px;
}

.song-card button {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

audio {
  width: 100%;
  margin-top: 10px;
}

.section {
  display: none;
}

.active {
  display: block;
}

.embed-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(300px,1fr));
  gap: 20px;
  margin-bottom: 30px;
}

.mini-player {
  position: fixed;
  bottom: 0;
  left: 240px;
  right: 0;
  background: rgba(0,0,0,0.8);
  padding: 15px;
  backdrop-filter: blur(12px);
}

.visitor-box {
  position: fixed;
  top: 15px;
  right: 15px;
  background: #00ffae;
  color: black;
  padding: 10px 16px;
  border-radius: 20px;
  font-weight: bold;
}

.admin-box input {
  width: 100%;
  padding: 10px;
  border-radius: 12px;
  border: none;
  margin-top: 10px;
}

.admin-box button {
  margin-top: 10px;
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 12px;
}
</style>
</head>
<body>

<div class="sidebar">
  <h1>🎵 7E Spenda</h1>
  <p>PT.NASAJAXA FIYYAN</p>

  <button onclick="showSection('library')">📚 Perpustakaan</button>
  <button onclick="showSection('playlist')">💜 Playlist</button>
  <button onclick="showSection('favorites')">⭐ Favorit</button>
  <button onclick="showSection('admin')">👑 Admin</button>
  <button onclick="shareToClass()">📤 Share Kelas</button>
</div>

<div class="visitor-box">
👀 Pengunjung: <span id="visitorCount"></span>
</div>

<div class="main">

<div class="topbar">
<input type="text" id="search" placeholder="Cari lagu..." onkeyup="searchSong()">
</div>

<section id="library" class="section active">

<h2>🔥 Trending Spotify & YouTube</h2>

<div class="embed-grid">
<iframe style="border-radius:12px"
src="https://open.spotify.com/embed/track/4uLU6hMCjMI75M1A2tKUQC"
width="100%"
height="152"
frameBorder="0"
allowfullscreen=""
allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>

<iframe width="100%" height="200"
src="https://www.youtube.com/embed/jfKfPfyJRdk"
frameborder="0"
allowfullscreen></iframe>
</div>

<h2>📚 Perpustakaan Lagu</h2>
<div id="songList" class="song-grid"></div>

</section>

<section id="playlist" class="section">
<h2>💜 Playlist Saya</h2>
<div id="playlistSongs" class="song-grid"></div>
</section>

<section id="favorites" class="section">
<h2>⭐ Favorit</h2>
<div id="favoriteSongs" class="song-grid"></div>
</section>

<section id="admin" class="section">
<h2>👑 Panel Admin</h2>

<div class="admin-box">
<input type="password" id="adminPass" placeholder="Password Admin">
<button onclick="loginAdmin()">Login</button>

<div id="adminPanel" style="display:none;">

<input type="text" id="songTitle" placeholder="Judul Lagu">
<input type="text" id="songArtist" placeholder="Artist">
<input type="text" id="songAudio" placeholder="Link MP3">
<input type="text" id="songCover" placeholder="Link Cover">

<button onclick="addSong()">➕ Tambahkan Lagu</button>

<h3 style="margin-top:20px;">📊 Statistik</h3>
<p>Total Lagu: <span id="totalSongs"></span></p>
<p>Total Favorit: <span id="totalFav"></span></p>

</div>
</div>

</section>

</div>

<div class="mini-player">
<p id="nowPlaying">🎵 Tidak ada lagu diputar</p>
</div>

<script>
const songs = JSON.parse(localStorage.getItem('songs')) || [
{
 title:'Night Sky',
 artist:'PT.NASAJAXA FIYYAN',
 audio:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',
 cover:'https://picsum.photos/300?1'
},
{
 title:'Galaxy Dreams',
 artist:'7E Studio',
 audio:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3',
 cover:'https://picsum.photos/300?2'
}
];

let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
let playlist = JSON.parse(localStorage.getItem('playlist')) || [];

function saveData(){
 localStorage.setItem('songs',JSON.stringify(songs));
 localStorage.setItem('favorites',JSON.stringify(favorites));
 localStorage.setItem('playlist',JSON.stringify(playlist));
}

function renderSongs(data=songs){
 const songList=document.getElementById('songList');
 songList.innerHTML='';

 data.forEach((song,index)=>{
  songList.innerHTML += `
  <div class="song-card">
  <img src="${song.cover}">
  <h3>${song.title}</h3>
  <p>${song.artist}</p>

  <audio controls onplay="setNowPlaying('${song.title}')">
  <source src="${song.audio}" type="audio/mp3">
  </audio>

  <button onclick="addFavorite(${index})">⭐ Favorit</button>
  <button onclick="addPlaylist(${index})">💜 Playlist</button>
  <button onclick="shareSong('${song.title}')">📤 Share</button>
  </div>
  `;
 });

 updateStats();
}

function addFavorite(index){
 favorites.push(songs[index]);
 saveData();
 renderFavorites();
 alert('Ditambahkan ke favorit 😎');
}

function addPlaylist(index){
 playlist.push(songs[index]);
 saveData();
 renderPlaylist();
 alert('Masuk playlist 💜');
}

function renderFavorites(){
 const favoriteSongs=document.getElementById('favoriteSongs');
 favoriteSongs.innerHTML='';

 favorites.forEach(song=>{
  favoriteSongs.innerHTML += `
  <div class="song-card">
  <img src="${song.cover}">
  <h3>${song.title}</h3>
  <p>${song.artist}</p>
  </div>
  `;
 });
}

function renderPlaylist(){
 const playlistSongs=document.getElementById('playlistSongs');
 playlistSongs.innerHTML='';

 playlist.forEach(song=>{
  playlistSongs.innerHTML += `
  <div class="song-card">
  <img src="${song.cover}">
  <h3>${song.title}</h3>
  <p>${song.artist}</p>
  </div>
  `;
 });
}

function searchSong(){
 const value=document.getElementById('search').value.toLowerCase();
 const filtered=songs.filter(song=>song.title.toLowerCase().includes(value));
 renderSongs(filtered);
}

function showSection(id){
 document.querySelectorAll('.section').forEach(section=>{
  section.classList.remove('active');
 });

 document.getElementById(id).classList.add('active');
}

function loginAdmin(){
 const pass=document.getElementById('adminPass').value;

 if(pass==='7espenda'){
  document.getElementById('adminPanel').style.display='block';
  alert('Login admin berhasil 🚀');
 } else {
  alert('Password salah 😹');
 }
}

function addSong(){
 const title=document.getElementById('songTitle').value;
 const artist=document.getElementById('songArtist').value;
 const audio=document.getElementById('songAudio').value;
 const cover=document.getElementById('songCover').value;

 songs.push({title,artist,audio,cover});
 saveData();
 renderSongs();

 alert('Lagu berhasil ditambahkan 🎵');
}

function updateStats(){
 document.getElementById('totalSongs').innerText=songs.length;
 document.getElementById('totalFav').innerText=favorites.length;
}

function shareSong(title){
 navigator.clipboard.writeText('🎵 Dengarkan '+title+' di Kelas 7E Spenda Music');
 alert('Link berhasil disalin 😎');
}

function setNowPlaying(title){
 document.getElementById('nowPlaying').innerText='🎵 Sedang diputar: '+title;
}

function shareToClass(){
 navigator.clipboard.writeText('🎵 Ayo buka Kelas 7E Spenda Music sekarang!');
 alert('Pesan berhasil disalin 😹');
}

let visitors=localStorage.getItem('visitors') || 0;
visitors++;
localStorage.setItem('visitors',visitors);

document.getElementById('visitorCount').innerText=visitors;

let currentUser=localStorage.getItem('currentUser') || 'Guest';

if(currentUser==='Guest'){
 const username=prompt('Masukkan nama kamu 😹');

 if(username){
  currentUser=username;
  localStorage.setItem('currentUser',username);
 }
}

renderSongs();
renderFavorites();
renderPlaylist();
</script>

</body>
</html>
